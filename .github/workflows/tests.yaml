name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System libraries for sf / terra / exactextractr
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("testthat","dplyr","tidyr","purrr","tibble","checkmate","sf","terra","exactextractr","here","rprojroot"))'

      - name: Run E2SFCA method tests
        run: Rscript tests/testthat.R
