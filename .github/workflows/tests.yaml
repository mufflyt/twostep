name: tests

# DISABLED: this workflow does not auto-run. Reproducibility is verified
# LOCALLY with `Rscript tests/testthat.R` (742 tests). Auto-triggers were
# removed to avoid consuming CI minutes and to avoid a misleading red badge:
# as written this job installs unpinned CRAN packages (not `renv::restore()`)
# and never installs the required private `mufflyaccess` dependency, so it
# cannot pass. Re-enable by restoring `push:`/`pull_request:` below AFTER
# switching the dependency step to `renv::restore()` and making
# `mufflyaccess` installable in CI. Until then it is manual-only.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System libraries for sf / terra / exactextractr
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("testthat","dplyr","tidyr","purrr","tibble","checkmate","sf","terra","exactextractr","here","rprojroot"))'

      - name: Run E2SFCA method tests
        run: Rscript tests/testthat.R
