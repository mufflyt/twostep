name: pr-scientific-gate

# BLOCKING pull-request gate for scientific validity.
#
# Until this existed, the entire scientific layer -- 245 E2SFCA assertions and
# the 9-mutant corpus -- ran ONLY at 23:17. A pull request could break the
# accessibility calculation and merge cleanly, and nobody would learn until the
# next nightly. contract-tests.yml runs on every push but covers a deliberately
# dependency-light SUBSET that never loads the engine.
#
# Two jobs, cheapest first, so an obvious break reports in under a minute
# instead of after a geospatial install:
#
#   structure   base R only, no package installation at all
#   scientific  the four E2SFCA suites plus the mutation corpus
#
# Target is well under the 15-minute budget for a PR gate. Measured locally:
# published 7s, invariants 17s, metamorphic 13s, simulation 57s, corpus ~2m45s.
# Dependency installation dominates and is cached between runs.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-sci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  # The repo root has a .Rprofile sourcing renv/activate.R, which switches
  # .libPaths() to the empty renv project library and hides everything installed
  # below. See the note in nightly.yml.
  RENV_CONFIG_AUTOLOADER_ENABLED: false

jobs:
  structure:
    name: structure (no dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # Base R only. These four catch the breaks that make everything else
      # meaningless, and they finish before a dependency install would start.
      - name: Repository preflight
        run: Rscript tools/ci/check_preflight.R
      - name: Syntax and package encoding
        run: Rscript tools/ci/check_parse.R
      - name: Package source hygiene
        run: Rscript tools/ci/check_hygiene.R
      - name: Export-tag drift
        run: Rscript tools/sync_namespace.R --check
      - name: Install yaml and rprojroot
        run: install.packages(c("yaml", "rprojroot", "digest"))
        shell: Rscript {0}
      # Identities on the FROZEN artifacts, not on fixtures: two independent
      # computations of national access must agree, derived ratios must match
      # their own columns, nested catchments must be monotone, and the same
      # quantity must agree across artifacts. Cheap, and catches a corrupted or
      # stale artifact before it merges.
      - name: Frozen-artifact scientific invariants
        run: Rscript tools/ci/check_scientific_invariants.R
      # Supply conservation. Every origin entering E2SFCA must have a catchment.
      # A local age-matched run dropped supply in 12 of 14 cells -- FPMRS lost 15
      # of 580 origins -- which deflated every affected mean while reporting
      # success. This is expected to FAIL until the panel is regenerated from a
      # fail-closed run; that is the point.
      - name: No supply may enter E2SFCA without a catchment
        run: Rscript tools/ci/check_supply_conservation.R
      # One artifact: every live age-matched consumer must read the panel, never
      # the standalone 2020 file. They are byte-identical today, so a consumer
      # pointed at the wrong one has no symptom until they diverge -- which has
      # already happened once.
      - name: Age-matched chain has a single source
        run: Rscript tools/ci/check_agematched_ssot.R



      # Data-adversarial corpus. mutation_corpus.R mutates the ENGINE and asks
      # whether the tests notice; this corrupts the STUDY and asks whether the
      # invariants notice. That matters more here, because the manuscript does
      # not read the engine -- it reads e2sfca_national_summary.csv.
      #
      # The hash gate is deliberately held out as a detector: sha256 answers
      # "was the artifact edited?", which kills every mutant trivially. The
      # question that threatens the paper is different -- when the artifact is
      # legitimately REGENERATED, does anything notice the numbers are
      # impossible? Only the invariants can answer that.
      #
      # Self-guarding: the control must pass first, every mutation must actually
      # change the file (a no-op reads exactly like a detector gap), and the
      # artifact must be restored byte-identically.
      - name: Data-adversarial corpus on the frozen study
        run: Rscript tools/ci/data_adversarial_corpus.R
      - name: Fail if the corpus left the study corrupted
        if: always()
        run: |
          if ! git diff --quiet -- artifacts/; then
            echo "::error::the data corpus left a frozen artifact modified"
            git --no-pager diff --stat -- artifacts/
            exit 1
          fi
          echo "frozen artifacts unmodified"

      - name: README agrees with the repository
        run: Rscript tools/ci/check_readme.R
      # YAML validity does not imply the shell inside it is valid. A stray quote
      # in a run: block ships cleanly and then kills the job on the runner with
      # a bare "exit code 2" -- which is exactly how the previous nightly failed,
      # AFTER the work the step was verifying had already succeeded.
      - name: Every bash workflow step parses
        run: Rscript tools/ci/check_workflow_syntax.R
      # bash -n does not expand heredocs, so an R accessor like ref$variant
      # inside an UNQUOTED heredoc is eaten by the shell and only fails at
      # runtime -- after an instance has been provisioned. This catches it here.
      - name: Unquoted heredocs expand only defined variables
        run: Rscript tools/ci/check_launcher_heredoc.R


      # Two guards that existed but were never wired -- an unrun guard is worse
      # than none, because it reads as coverage. The Rd check catches a literal
      # `%` in documentation prose (it is Rd's comment character, and roxygen
      # escapes it only inside @examples). The appendix check enforces the
      # rendering script's stated invariant: analysis numbers must be COMPUTED
      # from artifacts, never typed, because typed numbers go stale silently.
      - name: Rd files contain no unescaped percent signs
        run: Rscript tools/ci/check_rd_percent.R
      - name: Appendix numbers are computed, not typed
        run: Rscript tools/ci/check_appendix_literals.R

  scientific:
    name: scientific validity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      # Ordered so the EXTERNAL oracle speaks first: if twostep has stopped
      # implementing the published method, that is the most informative failure
      # and the cheapest to produce.
      - name: Luo and Qi 2009 published fixture
        run: Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-luo-qi-2009-published.R", stop_on_failure = TRUE)'
      - name: Delamater 2013 published M2SFCA fixture
        run: Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-delamater-2013-m2sfca.R", stop_on_failure = TRUE)'
      - name: Mathematical invariants and three-implementation agreement
        run: Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-invariants-and-reference.R", stop_on_failure = TRUE)'
      - name: Metamorphic geography, weight and overlap algebra, closed forms
        run: Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-metamorphic-and-algebra.R", stop_on_failure = TRUE)'
      - name: Monte Carlo null and known-signal recovery
        run: Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-simulation-null-and-signal.R", stop_on_failure = TRUE)'

      # Coverage of the SCIENTIFIC CORE, asked as a yes/no question per export
      # rather than as a percentage. A headline coverage number can stay high
      # while an exported function is called by nothing at all -- which is how
      # dj7_tract_access, then nine more, turned out to be untested. Runs here
      # rather than in the structure job because it resolves each export against
      # the installed namespace to tell a function from a constant; without the
      # package it falls back to a name heuristic and is weaker.
      # Sources scripts/manuscript_e2sfca_values.R, which needs
      # dplyr/readr/tidyr/here and mufflyaccess from the DESCRIPTION Remotes
      # field -- so it must live in a job with setup-r-dependencies, not in a
      # bare-install gate job. It records the 47 reported headline numbers and a
      # hash over the whole series, and fails on unexplained movement against
      # the committed baseline.
      - name: Reported headline numbers have not moved
        run: Rscript tools/ci/scientific_diff.R

      - name: No scientific-core export may be untested
        run: Rscript tools/ci/scientific_coverage.R

      # The corpus is last because it is the slowest, and because it is only
      # meaningful if the suites above are green: it asks whether those suites
      # would NOTICE a scientific mistake, which presupposes they pass.
      - name: Every named scientific mutant must be killed
        run: Rscript tools/ci/mutation_corpus.R --quick
      - name: Fail if the corpus left the engine mutated
        run: |
          if ! git diff --quiet R/two_step_floating_catchment.R; then
            echo "::error::the mutation corpus left the engine modified"
            git --no-pager diff --stat R/two_step_floating_catchment.R
            exit 1
          fi
          echo "engine unmodified"

  scientific-gate:
    name: scientific gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [structure, scientific]
    steps:
      - name: Require every scientific component to pass
        run: |
          {
            echo "| component | result |"
            echo "|---|---|"
            echo "| structure | ${{ needs.structure.result }} |"
            echo "| scientific validity | ${{ needs.scientific.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.structure.result }}" "${{ needs.scientific.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a scientific gate did not succeed; this PR must not merge"
              exit 1
            fi
          done
          echo "scientific gate: PASS"
