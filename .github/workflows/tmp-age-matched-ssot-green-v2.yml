name: tmp-age-matched-ssot-green-v2

on:
  push:
    branches:
      - chatgpt/age-matched-manuscript-regeneration

permissions:
  contents: write

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  RENV_CONFIG_AUTOLOADER_ENABLED: false

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed manuscript SSOT fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          panel = (
              "artifacts/2sfca/agematched_panel/age_matched_panel.csv"
          )
          legacy = "artifacts/multiverse/age_matched_results.csv"
          archive = (
              "artifacts/multiverse/_precorrection/"
              "age_matched_results_CONTAMINATED_2020.csv"
          )

          def sub_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              revised, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one match in {path}, found {count}"
                  )
              p.write_text(revised)
              print("patched:", label)

          def literal_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one match in {path}, found {count}"
                  )
              p.write_text(text.replace(old, new, 1))
              print("patched:", label)

          main = "manuscript/e2sfca_accessibility_manuscript.Rmd"
          sub_once(
              main,
              r'\.am_panel <- here::here\("artifacts", "2sfca", '
              r'"agematched_panel", "age_matched_panel\.csv"\)\n'
              r'\.am_path\s*<- if \(file\.exists\(\.am_panel\)\) '
              r'\.am_panel else\n\s*here::here\("artifacts", "multiverse", '
              r'"age_matched_results\.csv"\)',
              '.am_path <- here::here(\n'
              '  "artifacts", "2sfca", "agematched_panel",\n'
              '  "age_matched_panel.csv"\n'
              ')',
              "main panel is fail-closed",
          )
          sub_once(
              main,
              r'# SUPPLY CONSERVATION, enforced at render time\..*?'
              r'# regenerated from a run where every origin has a catchment\.',
              '# SUPPLY CONSERVATION, enforced at render time. An earlier '
              'standalone\n'
              '# 2020 artifact silently dropped supply in 12 of 14 cells '
              '(FPMRS lost 15\n'
              '# of 580 origins; GO lost 5 of 516). The corrected panel must '
              'conserve\n'
              '# every origin in every year and regime before its values can '
              'enter the\n'
              '# manuscript.',
              "main conservation comment",
          )

          appendix = "manuscript/appendix_age_matched_denominators.Rmd"
          sub_once(
              appendix,
              r'panel_path <- file\.path\(root, '
              r'"artifacts/2sfca/agematched_panel/age_matched_panel\.csv"\)\n'
              r'res_path\s*<-.*?have_results <- !is\.null\(res\) && '
              r'nrow\(res\) > 0',
              'panel_path <- file.path(\n'
              '  root, "artifacts/2sfca/agematched_panel/'
              'age_matched_panel.csv"\n'
              ')\n'
              'if (!file.exists(panel_path))\n'
              '  stop("corrected age-matched panel missing: ", panel_path)\n'
              'res <- utils::read.csv(panel_path, stringsAsFactors = FALSE)\n'
              'if ("year" %in% names(res))\n'
              '  res <- res[res$year == 2020L, , drop = FALSE]\n'
              'have_results <- nrow(res) == 14L',
              "appendix panel is fail-closed",
          )
          literal_once(
              appendix,
              '.am <- file.path(root, "artifacts/multiverse/'
              'age_matched_results.csv")',
              '.am <- file.path(\n'
              '  root, "artifacts/multiverse/_precorrection",\n'
              '  "age_matched_results_CONTAMINATED_2020.csv"\n'
              ')',
              "appendix historical input is archived contaminated run",
          )
          literal_once(
              appendix,
              '100 * (.got - .ref) / .ref',
              '100 * (.ref - .got) / .ref',
              "appendix historical shortfall sign",
          )
          literal_once(
              appendix,
              'Only the demand denominator differs. Any incompleteness in the '
              'reproduction\n'
              'inputs therefore affects both regimes equally and cancels in '
              'the contrast.',
              'Only the demand denominator differs. In the corrected analysis, '
              'complete\n'
              'provider-to-catchment coverage is required in both regimes; no '
              'supply\n'
              'incompleteness is permitted to enter either side of a contrast.',
              "appendix removes cancellation overclaim",
          )
          appendix_text = Path(appendix).read_text()
          if legacy not in appendix_text:
              raise SystemExit(
                  "appendix: expected remaining legacy explanatory paths"
              )
          Path(appendix).write_text(
              appendix_text.replace(legacy, panel)
          )
          print("patched: appendix remaining live SSOT references")

          plot = "tools/multiverse/plot_age_matched.R"
          literal_once(
              plot,
              legacy,
              panel,
              "figure reads corrected panel",
          )
          literal_once(
              plot,
              'res <- utils::read.csv(RES, stringsAsFactors = FALSE)',
              'panel <- utils::read.csv(RES, stringsAsFactors = FALSE)\n'
              'res <- panel[panel$year == 2020L, , drop = FALSE]\n'
              'if (nrow(res) != 14L)\n'
              '  stop("corrected panel must contain 14 rows for 2020; found ", '
              'nrow(res))',
              "figure subsets 2020 from panel",
          )
          literal_once(
              plot,
              '#      within subspecialty, all-ages to age-matched. A flat line '
              'means the\n'
              '#      disparity does not depend on the denominator. A line '
              'crossing 1.0 is a\n'
              '#      reversal. Ratios are dimensionless, so this comparison is '
              'legitimate.',
              '#      within subspecialty, all-ages to age-matched. Small '
              'movement indicates\n'
              '#      robustness; a line crossing 1.0 is a reversal. Ratios are\n'
              '#      dimensionless, so this comparison is legitimate.',
              "figure contrast interpretation",
          )
          literal_once(
              plot,
              'main = "B. Disparity contrasts are\\nunchanged by the denominator"',
              'main = "B. Disparity contrasts persist\\nunder age matching"',
              "figure contrast title",
          )

          render_appendix = "tools/ci/render_appendix.sh"
          literal_once(
              render_appendix,
              legacy,
              panel,
              "appendix render guard reads corrected panel",
          )

          workflow = ".github/workflows/pr-scientific-gate.yml"
          workflow_text = Path(workflow).read_text()
          guard_run = (
              "Rscript tools/ci/check_age_matched_manuscript_ssot.R"
          )
          if guard_run not in workflow_text:
              marker = (
                  "      - name: No supply may enter E2SFCA without a catchment\n"
                  "        run: Rscript tools/ci/check_supply_conservation.R\n"
              )
              if workflow_text.count(marker) != 1:
                  raise SystemExit(
                      "PR gate: could not find unique supply-conservation step"
                  )
              addition = (
                  marker
                  + "      - name: Manuscript uses corrected age-matched SSOT only\n"
                  + f"        run: {guard_run}\n"
              )
              Path(workflow).write_text(
                  workflow_text.replace(marker, addition, 1)
              )
              print("patched: wired SSOT guard into PR gate")

          sums = Path("SHA256SUMS.txt")
          hash_line = (
              "485df006e8156a5f15add4ad6173e752d320c6d21b2f33f2e1f7e4e4cb025064"
              "  " + panel
          )
          sum_text = sums.read_text().rstrip() + "\n"
          if hash_line not in sum_text:
              sums.write_text(sum_text + hash_line + "\n")
              print("patched: corrected panel SHA-256 pin")

          stale = Path("manuscript/appendix_age_matched_denominators.docx")
          if stale.exists():
              stale.unlink()
              print("removed: stale appendix DOCX")

          for path in (main, appendix, plot, render_appendix):
              if legacy in Path(path).read_text():
                  raise SystemExit(
                      f"legacy live results path remains in {path}: {legacy}"
                  )
          print("live consumers now fail closed on", panel)
          print("historical example reads", archive)
          PY

      - name: New SSOT guard must now pass
        run: Rscript tools/ci/check_age_matched_manuscript_ssot.R

      - name: Verify corrected panel claims independently
        shell: bash
        run: |
          python - <<'PY'
          import csv

          path = "artifacts/2sfca/agematched_panel/age_matched_panel.csv"
          with open(path, newline="") as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 154:
              raise SystemExit(f"expected 154 panel rows, found {len(rows)}")
          if any(
              int(row["n_supply_origins"]) != int(row["n_iso_origins"])
              for row in rows
          ):
              raise SystemExit("corrected panel drops at least one supply origin")

          years = sorted({int(row["year"]) for row in rows})
          differing = 0
          ranks_2020 = {}
          for year in years:
              cells = [row for row in rows if int(row["year"]) == year]
              ranks = {}
              for regime in ("all_ages", "age_matched"):
                  subset = [row for row in cells if row["regime"] == regime]
                  ranks[regime] = [
                      row["subspec"]
                      for row in sorted(
                          subset,
                          key=lambda row: -float(row["national"]),
                      )
                  ]
              differing += ranks["all_ages"] != ranks["age_matched"]
              if year == 2020:
                  ranks_2020 = ranks

          expected_all = [
              "MFM", "GO", "REI", "FPMRS", "MIGS", "PAG", "CFP"
          ]
          expected_age = [
              "MFM", "REI", "GO", "FPMRS", "PAG", "MIGS", "CFP"
          ]
          if ranks_2020.get("all_ages") != expected_all:
              raise SystemExit("unexpected 2020 all-ages ordering")
          if ranks_2020.get("age_matched") != expected_age:
              raise SystemExit("unexpected 2020 age-matched ordering")
          if differing != 10:
              raise SystemExit(
                  f"expected ordering to differ in 10 years, found {differing}"
              )

          age_2020 = [
              row for row in rows
              if int(row["year"]) == 2020
              and row["regime"] == "age_matched"
          ]
          c2 = max(float(row["rural_metro_ratio"]) for row in age_2020)
          c3 = max(float(row["aian_white_ratio"]) for row in age_2020)
          if not (c2 < 1 and c3 < 1):
              raise SystemExit(f"disparity direction reversed: C2={c2}, C3={c3}")
          print(f"panel rows: {len(rows)}; zero dropped origins")
          print(f"2020 C2 max rural:metro: {c2:.10f}")
          print(f"2020 C3 max AIAN:White: {c3:.10f}")
          print(f"ordering differs in {differing} of {len(years)} years")
          PY

      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev pandoc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::knitr
            any::kableExtra
            any::yaml
            any::rprojroot
          needs: check

      - name: Regenerate SDC age-matched figure
        run: Rscript tools/multiverse/plot_age_matched.R

      - name: Run structural and scientific guards
        run: |
          Rscript tools/ci/check_parse.R
          Rscript tools/ci/check_supply_conservation.R
          Rscript tools/ci/check_appendix_literals.R
          Rscript tools/ci/check_age_matched_manuscript_ssot.R

      - name: Render main manuscript
        run: Rscript render.R

      - name: Manuscript semantic QA
        run: Rscript tools/ci/check_manuscript.R

      - name: Verify corrected claims reached rendered manuscript
        shell: bash
        run: |
          python - <<'PY'
          from html import unescape
          from pathlib import Path
          import re

          raw = Path(
              "manuscript/e2sfca_accessibility_manuscript.html"
          ).read_text()
          plain = unescape(re.sub(r"<[^>]+>", " ", raw))
          plain = " ".join(plain.split())
          for needle in (
              "two pairs exchange rank",
              "10 of the 11 study years",
          ):
              if needle not in plain:
                  raise SystemExit(
                      f"rendered manuscript is missing corrected claim: {needle}"
                  )
              print("render contains:", needle)
          PY
          test -s manuscript/figures/fig_age_matched_denominators.jpg
          test ! -e manuscript/appendix_age_matched_denominators.docx

      - name: Upload regenerated main manuscript
        uses: actions/upload-artifact@v7
        with:
          name: corrected-age-matched-main-manuscript
          path: |
            manuscript/e2sfca_accessibility_manuscript.html
            manuscript/e2sfca_accessibility_manuscript.docx
            manuscript/figures/fig_age_matched_denominators.jpg
            manuscript/appendix_age_matched_denominators.Rmd
          retention-days: 30
          if-no-files-found: error

      - name: Commit verified manuscript-chain fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-age-matched-ssot-green-v2.yml
          git add \
            SHA256SUMS.txt \
            .github/workflows/pr-scientific-gate.yml \
            tools/ci/check_age_matched_manuscript_ssot.R \
            tools/ci/render_appendix.sh \
            tools/multiverse/plot_age_matched.R \
            manuscript/e2sfca_accessibility_manuscript.Rmd \
            manuscript/appendix_age_matched_denominators.Rmd \
            manuscript/figures/fig_age_matched_denominators.jpg
          git add -u \
            manuscript/appendix_age_matched_denominators.docx \
            .github/workflows/tmp-age-matched-ssot-green-v2.yml
          git diff --cached --check
          git commit -m \
            "fix(manuscript): fail closed on corrected age-matched panel"
          git push origin HEAD:chatgpt/age-matched-manuscript-regeneration
