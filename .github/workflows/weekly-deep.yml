name: weekly-deep

# Tier C: the deep scientific audit. Everything here is too slow to run nightly
# and too valuable to run never.
#
# Three things make this DEEPER rather than merely longer:
#
#   1. 1000 Monte Carlo replicates instead of 200. Every seed is still fixed, so
#      this makes the SAME tests sharper rather than making them different tests.
#      The Monte Carlo standard error scales as 1/sqrt(N), so the smallest bias
#      the null can detect tightens by more than a factor of two.
#
#   2. The full mutation corpus with --all-suites: every suite is run against
#      every mutant instead of stopping at the first kill. In normal mode the
#      fast suites kill almost everything, so the later suites never execute and
#      their contribution is never measured. This produces a kill MATRIX, and
#      names the mutants caught by exactly ONE suite -- single points of failure
#      where weakening that suite would let a scientific error through with
#      nothing else noticing.
#
#   3. No dependency cache. A broken dependency declaration can otherwise hide
#      for months behind a warm cache; once a week, everything installs cold.
#
# Sunday 04:17 America/Denver: off the nightly's 23:17 so the two never contend,
# and :17 avoids the top-of-hour scheduling backlog.

on:
  schedule:
    - cron: "17 4 * * 0"
      timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      replicates:
        description: "Monte Carlo replicates"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: weekly-deep
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  # See nightly.yml: the repo .Rprofile activates renv and would hide every
  # package installed below behind an empty project library.
  RENV_CONFIG_AUTOLOADER_ENABLED: false

jobs:
  deep-simulation:
    name: Monte Carlo deep run (${{ github.event.inputs.replicates || '1000' }} replicates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
          # Cold install once a week, so a broken dependency declaration cannot
          # hide behind a cache that was warmed before it broke.
          cache: false

      - name: Monte Carlo null and known-signal recovery, deep
        env:
          E2SFCA_MC_REPLICATES: ${{ github.event.inputs.replicates || '1000' }}
        run: |
          set -o pipefail
          Rscript -e 'testthat::set_max_fails(Inf); testthat::test_file("tests/testthat/test-e2sfca-simulation-null-and-signal.R", stop_on_failure = TRUE)' 2>&1 | tee deep-mc.log
          echo "DEEP-MC-COMPLETED" >> deep-mc.log

      # Four independent failure conditions. (1) is already covered by
      # `set -o pipefail` on the step above; (2)-(4) are checked here.
      #
      # NOTE: `if-no-files-found: error` below is defensive hardening, not a fix
      # for the earlier "0 KB artifact" observation. That observation was
      # measurement timing -- the artifacts API computes size asynchronously and
      # was queried seconds after the run. The logs were never missing or empty.
      - name: The audit record must exist and account for the whole run
        if: always()
        run: |
          # (4) absent or zero bytes
          test -s deep-mc.log || { echo "::error::deep-mc.log missing or empty"; exit 1; }
          echo "deep-mc.log: $(wc -c < deep-mc.log) bytes, $(wc -l < deep-mc.log) lines"

          # (3) PASS/FAIL sentinel present -- a run that died partway must not
          #     be able to masquerade as a pass
          grep -q "MC-AUDIT-SENTINEL:" deep-mc.log \
            || { echo "::error::no MC-AUDIT-SENTINEL in deep-mc.log"; exit 1; }
          sentinel=$(grep -o "MC-AUDIT-SENTINEL: [A-Z]*" deep-mc.log | tail -1)
          echo "$sentinel"
          case "$sentinel" in
            *PASS) ;;
            *) echo "::error::audit sentinel is not PASS"; exit 1 ;;
          esac

          # (2) every requested replicate completed. Parsed from the dedicated
          #     MC-REPLICATES field, not from the human-readable summary line.
          acct=$(grep -o "MC-REPLICATES requested=[0-9]* completed=[0-9]*" deep-mc.log | tail -1)
          test -n "$acct" || { echo "::error::no MC-REPLICATES field in deep-mc.log"; exit 1; }
          echo "$acct"
          req=${acct#*requested=}; req=${req%% *}
          done_n=${acct#*completed=}
          if [ -z "$req" ] || [ -z "$done_n" ] || [ "$req" != "$done_n" ]; then
            echo "::error::replicate accounting mismatch: requested=$req completed=$done_n"; exit 1
          fi

          # evidence, not merely bytes
          grep -q "PRESPECIFIED ACCEPTANCE THRESHOLDS" deep-mc.log \
            || { echo "::error::no threshold block in deep-mc.log"; exit 1; }
          grep -q "DEEP-MC-COMPLETED" deep-mc.log \
            || { echo "::error::no completion sentinel"; exit 1; }

      - name: Upload the deep Monte Carlo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-monte-carlo
          path: deep-mc.log
          retention-days: 30
          if-no-files-found: error

  kill-matrix:
    name: full mutation corpus (kill matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
          cache: false

      # No --quick: the Monte Carlo suite is available as a killer too.
      # --all-suites: never stop at the first kill, so every suite's real
      # contribution is measured rather than assumed.
      - name: Every suite against every mutant
        run: |
          set -o pipefail
          Rscript tools/ci/mutation_corpus.R --all-suites 2>&1 | tee kill-matrix.log
          echo "KILL-MATRIX-COMPLETED" >> kill-matrix.log

      - name: Fail if the corpus left any source mutated
        run: |
          if ! git diff --quiet R/; then
            echo "::error::the mutation corpus left sources modified"
            git --no-pager diff --stat R/
            exit 1
          fi
          echo "sources unmodified"

      - name: The matrix must exist, be non-empty, and name every mutant
        if: always()
        run: |
          test -s kill-matrix.log || { echo "::error::kill-matrix.log missing or empty"; exit 1; }
          echo "kill-matrix.log: $(wc -c < kill-matrix.log) bytes, $(wc -l < kill-matrix.log) lines"
          n=$(grep -cE "KILLED|SURVIVED" kill-matrix.log || true)
          echo "mutant verdict lines: $n"
          # A matrix that reports on nothing is the failure mode this guard
          # exists for: the job would still be green and the artifact still
          # present. Require a verdict for every mutant in the corpus.
          # [a-z0-9_] not [a-z_]: m2_exponent_removed contains a digit, and an
          # undercount here would silently weaken the guard rather than trip it.
          expected=$(grep -cE "^  [a-z0-9_]+ = list\(" tools/ci/mutation_corpus.R || true)
          echo "mutants declared in the corpus: $expected"
          if [ "$n" -lt "$expected" ]; then
            echo "::error::only $n verdicts for $expected declared mutants"; exit 1
          fi
          grep -q "KILL-MATRIX-COMPLETED" kill-matrix.log \
            || { echo "::error::kill-matrix.log has no completion sentinel"; exit 1; }

      - name: Upload the kill matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-matrix
          path: kill-matrix.log
          retention-days: 90
          if-no-files-found: error

  deep-gate:
    name: weekly deep gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [deep-simulation, kill-matrix]
    steps:
      - name: Require both deep components
        run: |
          {
            echo "| component | result |"
            echo "|---|---|"
            echo "| Monte Carlo deep run | ${{ needs.deep-simulation.result }} |"
            echo "| full mutation corpus | ${{ needs['kill-matrix'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.deep-simulation.result }}" "${{ needs['kill-matrix'].result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a weekly deep component did not succeed"
              exit 1
            fi
          done
          echo "weekly deep audit: PASS"
