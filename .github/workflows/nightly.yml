name: nightly

# Full nightly verification. Each job gates a component that nothing else covers,
# ordered cheapest-first so an obvious break fails in seconds rather than after a
# 20-minute geospatial install.
#
#   syntax         every R file in the repo parses; package code stays ASCII
#   namespace      @export tags still match NAMESPACE  (the original drift bug)
#   checksums      pinned data + artifacts match their provenance manifests
#   lockfile       renv.lock is well formed and pins every hard Import
#   docs           committed man/ + NAMESPACE are what roxygen2 regenerates
#   R-CMD-check    package integrity across 4 OS/R combinations
#   testthat       805-assertion repository/method suite, source tree
#   renv-restore   the PINNED environment still reproduces and passes
#   summary        one required status aggregating the above
#
# Why several of these cannot be folded into R CMD check: tests/, scripts/,
# tools/ and data/ are all excluded from the package build on purpose, so the
# check never sees them. A syntax error in scripts/, a mutated vendored input, or
# a stale man/ page would otherwise reach main unnoticed.
#
# Complements contract-tests.yml, which gates the dependency-light
# twostep -> mufflyaccess SSOT contract on every push.

on:
  schedule:
    - cron: "17 23 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  # REQUIRED by every job that starts R in the workspace. The repo root has a
  # .Rprofile sourcing renv/activate.R, which switches .libPaths() to the renv
  # project library -- empty on a fresh runner -- so installed dependencies become
  # invisible and jobs fail on missing namespaces. Verified locally: unset ->
  # requireNamespace("dplyr") is FALSE; false/FALSE/0 -> TRUE.
  # The renv-restore job deliberately UNSETS this: reproducing the pinned
  # environment is the whole point of that job.
  RENV_CONFIG_AUTOLOADER_ENABLED: false

  # R VERSION POLICY, two tiers on purpose.
  #
  #   every job except renv-restore   "release" -- test against the R people
  #                                   actually have, so a new R that breaks this
  #                                   package surfaces here and not in a user's
  #                                   session. Today that resolves to 4.6.1.
  #   renv-restore                    the version recorded in renv.lock (4.4.2),
  #                                   read from the lockfile at run time.
  #
  # renv.lock pins the PACKAGE ENVIRONMENT and records the R version used to
  # build it. That is not a claim that every job must run 4.4.2 -- it is the
  # reproducibility contract for one job. Hard-pinning all of CI to the lockfile
  # version would be WEAKER, not stronger: it would freeze the whole matrix on
  # an ageing R and blind the nightly to release-driven breakage.
  #
  # A workflow-level pin was briefly added here while a CI hang was being
  # mis-diagnosed as R release resolution; the real cause was an unreachable
  # Ubuntu apt mirror. Do not reintroduce a global pin without a compatibility
  # reason, and record the reason if you do.

jobs:
  # ---------------------------------------------------------------- tier 1: fast
  scientific-invariants:
    name: frozen artifacts satisfy scientific invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      - name: Install rprojroot
        run: install.packages("rprojroot")
        shell: Rscript {0}
      # The test suite proves the ENGINE satisfies its invariants on synthetic
      # fixtures. This proves the PUBLISHED NUMBERS hold together: the two
      # independent computations of national access agree, derived ratios match
      # the columns they come from, nested-catchment monotonicity holds, shares
      # stay in [0,100], order statistics are ordered, and the same quantity
      # agrees across independently produced artifacts.
      #
      # Every check is an identity or inequality that must hold for ANY valid
      # run. Nothing here encodes what the answer should be -- only what could
      # not possibly be right.
      - name: Scientific invariants on the frozen artifacts
        run: Rscript tools/ci/check_scientific_invariants.R

  readme:
    name: README agrees with the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      - name: Install yaml
        run: install.packages(c("yaml","rprojroot"))
        shell: Rscript {0}
      # The README is the front page: every figure must exist, every
      # self-referential count must match what the tools report, and its claims
      # about the specification-curve result must match the frozen artifacts.
      # Hand-maintained numbers look precise and rot silently -- "35/35
      # exercised" was true the hour it was written.
      - name: README consistency audit
        run: Rscript tools/ci/check_readme.R
      # Two guards that existed but were never wired -- an unrun guard is worse
      # than none, because it reads as coverage. The Rd check catches a literal
      # `%` in documentation prose (it is Rd's comment character, and roxygen
      # escapes it only inside @examples). The appendix check enforces the
      # rendering script's stated invariant: analysis numbers must be COMPUTED
      # from artifacts, never typed, because typed numbers go stale silently.
      - name: Rd files contain no unescaped percent signs
        run: Rscript tools/ci/check_rd_percent.R
      - name: Appendix numbers are computed, not typed
        run: Rscript tools/ci/check_appendix_literals.R

  artifact-provenance:
    name: frozen artifacts record their inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # A checksum pins what an artifact IS; it says nothing about what produced
      # it. Attempting to re-run the sensitivity generator against inputs chosen
      # by search reproduced NONE of the frozen artifact -- the primary national
      # estimate came out 16.7% different -- and nothing recorded which input set
      # was correct. Non-strict for now: the gap is REPORTED because the inputs
      # are not currently recoverable. Switch to --strict once the manifests
      # exist, so it can never silently reappear.
      - name: Artifact input-provenance audit
        run: Rscript tools/ci/check_artifact_provenance.R

  multiverse:
    name: specification curve (freeze + determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install the few packages the runner needs
        run: install.packages(c("yaml","jsonlite","digest","rprojroot"))
        shell: Rscript {0}
      # Enforces the frozen grid before reading any outcome, checks completeness
      # and manifest/execution agreement, and fails if the MANUSCRIPT asserts a
      # robustness the specifications do not support. Fragility itself never
      # fails -- that is a scientific result, not a defect.
      - name: Run the frozen specification curve
        run: Rscript tools/multiverse/run_multiverse.R
      # Same inputs must give the same table. A nondeterministic specification is
      # a failure condition named in the manifest.
      - name: The same specification must be deterministic
        run: |
          a=$(sha256sum artifacts/multiverse/multiverse_results.csv | cut -d" " -f1)
          Rscript tools/multiverse/run_multiverse.R >/dev/null
          b=$(sha256sum artifacts/multiverse/multiverse_results.csv | cut -d" " -f1)
          if [ "$a" != "$b" ]; then
            echo "::error::the multiverse is nondeterministic: $a vs $b"; exit 1
          fi
          echo "deterministic: $a"
      # Catches a claim truth value edited by hand between runs.
      - name: Recorded claims must match recomputation
        run: Rscript tools/multiverse/run_multiverse.R --verify
      # The RESULT artifacts must reproduce byte-for-byte. provenance.json is
      # excluded because it records `executed_at`, a real wall-clock stamp that
      # legitimately differs every run -- checking it would make this job fail
      # every night for no scientific reason. Nothing is lost: provenance.json
      # carries the sha256 of each result file, and those files are compared
      # directly here, so a genuine change still fails.
      - name: Committed results must match a fresh run
        run: |
          changed=$(git diff --name-only -- artifacts/multiverse/ \
                    | grep -v 'provenance.json' || true)
          if [ -n "$changed" ]; then
            echo "::error::committed multiverse artifacts disagree with a fresh run"
            echo "$changed"
            git --no-pager diff --stat -- $changed
            exit 1
          fi
          echo "committed multiverse result artifacts reproduce exactly"
          echo "(provenance.json executed_at differs by design)"

  preflight:
    name: repository preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # Structural checks only, base R: DESCRIPTION parses and is complete, the
      # expected layout exists, no committed merge-conflict markers, no
      # case-colliding paths that would break a macOS or Windows checkout, no
      # oversized new files, and every script the workflows call actually exists.
      # A nightly that silently stops running because it calls a renamed script is
      # itself a failure mode.
      - name: Structural preflight
        run: Rscript tools/ci/check_preflight.R

  hygiene:
    name: package source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # The patterns that actually broke this repo: a top-level source() in R/
      # made R CMD INSTALL fail at lazy-load, which made the whole package
      # uninstallable and hid every other check behind it. Also catches setwd(),
      # install.packages(), quit(), .libPaths() and absolute developer paths in
      # package code.
      - name: Scan package code for dangerous patterns
        run: Rscript tools/ci/check_hygiene.R

  syntax:
    name: syntax + encoding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # No package installation: base R only, so this reports in well under a
      # minute and catches the breaks that make every other job pointless.
      - name: Parse every R file and check package encoding
        run: Rscript tools/ci/check_parse.R

  namespace:
    name: export-tag drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      # Zero-dependency by design, so it also works inside the renv sandbox where
      # roxygen2 is unavailable. Re-derives the export set from the @export tags
      # and compares it to NAMESPACE.
      - name: Check NAMESPACE against the @export tags
        run: Rscript tools/sync_namespace.R --check

  checksums:
    name: data + artifact provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No R at all.
      - name: Verify every provenance manifest
        run: bash tools/ci/check_checksums.sh

  # -------------------------------------------------------- tier 2: light deps
  lockfile:
    name: renv.lock integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      - name: Install jsonlite
        run: install.packages("jsonlite")
        shell: Rscript {0}
      - name: Validate renv.lock
        run: Rscript tools/ci/check_lockfile.R

  docs:
    name: documentation freshness
    runs-on: ubuntu-latest
    # 90, not 45. Three jobs died at exactly 45 minutes inside
    # setup-r-dependencies without ever running their actual step: a cold
    # dependency cache installing the geospatial stack (sf/terra/GDAL bindings)
    # does not reliably fit in 45 minutes, and the job is then reported as
    # "cancelled", which reads like someone stopped it rather than like a
    # timeout. weekly-deep already budgets 90-120 for the same reason -- it
    # installs cold on purpose. Raising this buys a real result instead of a
    # misleading cancellation; it does not weaken any gate.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygenise() runs pkgload::load_all(), so the full dependency tree is
          # needed, not just roxygen2.
          extra-packages: any::roxygen2
          needs: check
      # Roxygen output is version dependent: 8.0.0 writes one importFrom() per
      # line where newer versions collapse them into a multi-line call. The first
      # nightly failed on exactly that -- a diff that said nothing about the
      # sources. Pin to whatever generated the committed docs.
      - name: Pin roxygen2 to the version that generated the committed docs
        shell: Rscript {0}
        run: |
          v <- trimws(unname(read.dcf("DESCRIPTION")[1, "Config/roxygen2/version"]))
          if (is.na(v)) stop("DESCRIPTION has no Config/roxygen2/version")
          cat("pinning roxygen2 to", v, "\n")
          if (!identical(as.character(utils::packageVersion("roxygen2")), v))
            pak::pkg_install(paste0("roxygen2@", v))
      - name: Regenerate docs and fail on any diff
        run: Rscript tools/ci/check_docs_fresh.R

  # ------------------------------------------------------------ tier 3: heavy
  R-CMD-check:
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  r: "release",  experimental: false }
          - { os: ubuntu-latest,  r: "oldrel-1", experimental: false }
          - { os: macos-latest,   r: "release",  experimental: false }
          # Informational. Windows needs source builds of the geospatial stack and
          # R-devel breaks for reasons upstream of this package; neither should be
          # able to fail the nightly on its own.
          - { os: windows-latest, r: "release",  experimental: true  }
          - { os: ubuntu-latest,  r: "devel",    experimental: true  }
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # mufflyaccess resolves from the DESCRIPTION Remotes field. BAMMtools is
          # a guarded Suggests and was the last finding between this package and
          # Status: OK, so it is requested explicitly.
          extra-packages: |
            any::rcmdcheck
            any::BAMMtools
          needs: check
      # error-on note, not the action's default of warning. This package reached
      # Status: OK deliberately, and the default let it drift back: PR #10 added
      # an NSE column without declaring it, and the resulting "undefined global"
      # NOTE rode green nightlies for weeks because a NOTE is not a warning.
      # If a platform-specific NOTE appears here that is genuinely not worth
      # fixing, exempt it explicitly rather than lowering this back to warning.
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          error-on: '"note"'
      # Debugging should not mean scrolling 20,000 log lines.
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rcheck-${{ matrix.os }}-R${{ matrix.r }}
          path: |
            check/**/*.Rcheck/00check.log
            check/**/*.Rcheck/00install.out
            check/**/*.Rcheck/tests/**
          retention-days: 14
          if-no-files-found: ignore

  testthat:
    name: testthat suite (source tree)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: "release"
          use-public-rspm: true
      # The suite source()s the engine, which pulls sf/terra/exactextractr.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # twostep itself is NOT installed: every test reaches the code by
          # source()ing R/ directly and none attach the package, so this job tests
          # the working tree rather than a previously installed build.
          extra-packages: any::testthat
          needs: check
      - name: Report the mufflyaccess under test
        shell: Rscript {0}
        run: |
          cat("mufflyaccess", as.character(packageVersion("mufflyaccess")),
              "from", dirname(system.file(package = "mufflyaccess")), "\n")
      # test_dir() defaults to stop_on_failure = TRUE. Verified locally: exit 0
      # green, exit 1 with a deliberately failing assertion.
      # Do NOT hard-code an expected count: the suite should be free to grow or
      # shrink deliberately. Record the accounting instead, and require an
      # explicit end-of-suite sentinel so a truncated or crashed run can never be
      # mistaken for a pass.
      - name: Run the suite and record its accounting
        run: |
          set -o pipefail
          Rscript tests/testthat.R 2>&1 | tee testthat-output.txt
          echo "SUITE-COMPLETED" >> testthat-output.txt
          grep -E '^\[ FAIL' testthat-output.txt | tail -1 > testthat-accounting.txt || true
          # Persist the accounting where check_readme.R reads it, so the README's
          # assertion badge is compared against a REAL run rather than a guess.
          mkdir -p artifacts/ci
          cp testthat-accounting.txt artifacts/ci/testthat-accounting.txt
          if ! grep -q 'SUITE-COMPLETED' testthat-output.txt; then
            echo "::error::suite did not reach the end-of-run sentinel"; exit 1
          fi
          echo "accounting: $(cat testthat-accounting.txt)"
          {
            echo "### testthat"
            echo '```'
            cat testthat-accounting.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Asked here as well as on every PR, because the way this gate regresses
      # is by ADDING an export, not by changing one: a new @export can land in a
      # PR whose own tests are green and leave the function exercised by
      # nothing. The report is kept as an artifact so the SUPPORT and OTHER
      # tiers -- which warn rather than fail -- stay visible over time.
      - name: Scientific-core coverage
        if: always()
        run: |
          set -o pipefail
          Rscript tools/ci/scientific_coverage.R 2>&1 | tee scientific-coverage.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testthat-output
          path: |
            testthat-output.txt
            testthat-accounting.txt
            scientific-coverage.txt
          retention-days: 14
          if-no-files-found: ignore

  renv-restore:
    name: pinned environment reproduces
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # BLOCKING. This is the only job that exercises renv.lock as a reproducibility
    # contract rather than as a manifest, and it immediately earned that: it
    # caught three lockfile versions that do not exist on CRAN (ape 5.8.1,
    # bitops 1.0.9, nlme 3.1.166 -- dash forms normalised into dots). A gate that
    # finds a real bug and is then allowed to fail silently is worse than no gate.
    steps:
      - uses: actions/checkout@v7
      # R version comes from the LOCKFILE, not "release". The first nightly ran
      # this on R release and caTools failed to load: RSPM binaries are built per
      # R minor version, so restoring a 4.4.2 lockfile onto 4.5.x installs
      # binaries the session cannot load. Frozen reproducibility means frozen R.
      - name: Read the R version the lockfile was built with
        id: lockr
        run: |
          v=$(grep -m1 '"Version"' renv.lock | sed -E 's/.*"Version" *: *"([^"]+)".*/\1/')
          echo "Lockfile R version: $v"
          echo "r=$v" >> "$GITHUB_OUTPUT"
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: ${{ steps.lockr.outputs.r }}
          use-public-rspm: true
      # The extra four are what the first run reported missing for s2,
      # systemfonts, clipr and knitr.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libabsl-dev libfontconfig1-dev libx11-dev pandoc
      # NOTE: no RENV_CONFIG_AUTOLOADER_ENABLED override here. Every other job
      # disables the autoloader so pak-installed packages stay visible; this job
      # wants the opposite -- the project library renv builds from the lockfile.
      - name: Restore the locked environment and run the suite
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: true
        run: |
          Rscript -e 'install.packages("renv"); renv::restore(prompt = FALSE)'
          Rscript tests/testthat.R

  installed-isolation:
    name: installed package works outside the repo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { needs: check }
      # Build and install the real tarball, then run from OUTSIDE the checkout.
      # This is the only job that can catch a function silently depending on the
      # source tree -- here::here(), a relative path, an untracked file, or a
      # package that happens to sit in a developer library. Inside the repo every
      # one of those resolves by accident.
      - name: Build and install the tarball
        run: |
          R CMD build --no-manual --no-build-vignettes .
          R CMD INSTALL twostep_*.tar.gz
      - name: Exercise the public API from a directory outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/outside"
          cp tools/ci/smoke_installed.R "$RUNNER_TEMP/outside/"
          cd "$RUNNER_TEMP/outside"
          Rscript smoke_installed.R

  minimal-deps:
    name: loads with Imports only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      # dependencies: "hard" installs Depends/Imports/LinkingTo ONLY -- no
      # Suggests. A developer machine always has more installed than DESCRIPTION
      # declares, so this is what proves the declared Imports are actually
      # sufficient to load and use the package.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Build and install with hard dependencies only
        run: |
          R CMD build --no-manual --no-build-vignettes .
          R CMD INSTALL twostep_*.tar.gz
      - name: library(twostep) and core API must work without any Suggests
        shell: Rscript {0}
        run: |
          suggests <- c("ggplot2", "BAMMtools", "cowplot", "testthat", "shiny")
          present <- suggests[vapply(suggests, requireNamespace, logical(1), quietly = TRUE)]
          cat("Suggests present (expected none):", if (length(present)) paste(present, collapse = ", ") else "none", "\n")
          library(twostep)
          stopifnot(is.numeric(CANONICAL_BANDS))
          w <- e2sfca_band_weights()
          stopifnot(is.numeric(w), all(diff(w) <= 1e-9))
          inc <- e2sfca_incremental_weights(c("30" = 1, "60" = 0.5), step2_power = 2)
          stopifnot(all.equal(unname(inc), c(0.75, 0.25)))
          cat("core E2SFCA API works with Imports only\n")

  scientific-mutants:
    name: scientific mutation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      # Applies each NAMED scientific mutant to the engine in turn and requires
      # the scientific suites to kill it. A mutant that survives is a release
      # blocker whatever the coverage number says, and an anchor that stops
      # matching fails too -- a corpus that silently mutates nothing is worse
      # than no corpus. The engine is restored and byte-compared afterwards.
      - name: Every scientific mutant must be killed
        run: Rscript tools/ci/mutation_corpus.R --quick
      - name: Fail if the engine was left mutated
        run: |
          if ! git diff --quiet R/two_step_floating_catchment.R; then
            echo "::error::the mutation corpus left the engine modified"
            git --no-pager diff --stat R/two_step_floating_catchment.R
            exit 1
          fi
          echo "engine unmodified"

  manuscript:
    name: manuscript renders and reads correctly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev pandoc
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::knitr
            any::kableExtra
            any::xml2
          needs: check
      # render.R verifies every consumed artifact against SHA256SUMS.txt before
      # rendering, so a swapped or corrupted input fails here rather than
      # producing a plausible paper from the wrong data.
      - name: Render
        run: Rscript render.R
      # A render exiting 0 means the code ran, not that the paper is correct.
      # This scans the visible prose for bare NA/NaN/Inf, R error text, absolute
      # developer paths, unresolved citations, missing figures or tables, and
      # checks that the Figure 1 and Table 1 caption years agree.
      - name: Semantic QA
        run: Rscript tools/ci/check_manuscript.R
      # The strongest gate in the repo, and until now nothing ran it. It records
      # the 47 reported headline numbers plus a hash over the WHOLE reported
      # series and fails when any moves against a committed baseline, so a change
      # that alters a reported estimate cannot pass silently just because no test
      # asserts on it.
      #
      # It lives HERE, and not in a lightweight gate job, because it sources
      # scripts/manuscript_e2sfca_values.R -- which pulls dplyr/readr/tidyr/here
      # and hard-requires mufflyaccess from the DESCRIPTION Remotes field. Only a
      # job with setup-r-dependencies(needs: check) can resolve that. Wiring it
      # into a job with a bare install.packages() made it fail on CI having never
      # run, which is the exact defect this gate family exists to prevent.
      #
      # What it does and does not prove: the headline is READ from the frozen
      # national summary, not recomputed, so this detects drift in the reported
      # record -- it is not a reproduction check.
      - name: Reported headline numbers have not moved
        run: Rscript tools/ci/scientific_diff.R

      # Two more that existed but were wired into nothing. Both printed their
      # findings and exited 0 regardless, so each was documentation of a check
      # rather than a check. Both now return a status.
      #
      # Word count enforces only the abstract's 300-word Obstetrics &
      # Gynecology cap -- the one limit this repository has established. The
      # main-text count is reported, not gated.
      - name: Abstract is within the journal word limit
        run: Rscript scripts/check_wordcount.R
      # Fatal only when a Figure/Table is referenced but never defined. The
      # reverse (defined, never referenced) stays a warning: that is an
      # editorial choice, not a defect a reviewer would hit.
      - name: Figure and table cross-references resolve
        run: Rscript scripts/check_cross_references.R
      - name: Upload the rendered manuscript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-manuscript
          path: manuscript/e2sfca_accessibility_manuscript.html
          retention-days: 14
          if-no-files-found: ignore

  scientific-fingerprint:
    name: scientific fingerprint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { r-version: "release", use-public-rspm: true }
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { needs: check }

      # Every scientific suite runs on ubuntu and nowhere else, because tests/ is
      # excluded from the package build -- so the E2SFCA science has never
      # executed on macOS or Windows at all. Overlap fractions come out of GEOS,
      # and accessibility is a floating-point sum over them, so a platform that
      # intersects polygons differently produces different science while every
      # test still passes. Pass/fail on three machines is weaker than three
      # machines producing the SAME NUMBERS.
      - name: Emit the scientific fingerprint
        run: Rscript tools/ci/scientific_fingerprint.R fingerprint.json

      # DETERMINISM, on this platform: a second independent R session must give
      # bit-identical numbers. Tolerance 0 -- same inputs, same seeds, same code.
      - name: Determinism -- a second session must be bit-identical
        run: |
          Rscript tools/ci/scientific_fingerprint.R fingerprint2.json
          Rscript tools/ci/compare_fingerprints.R --tolerance 0 fingerprint.json fingerprint2.json

      - uses: actions/upload-artifact@v7
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.json
          retention-days: 30
          if-no-files-found: error

  scientific-cross-platform:
    name: platforms must agree on the science
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scientific-fingerprint
    steps:
      - uses: actions/checkout@v7
      # The runner's apt mirrorlist points at azure.archive.ubuntu.com, which is
      # intermittently unreachable. setup-r@v2 runs `apt-get update` as its
      # "Updating system package data" phase, so when that mirror is down the
      # action retries with exponential backoff until the step timeout kills it --
      # 25 `Ign:` lines and 10 wasted minutes, with nothing in the message to say
      # apt was the problem. It took down a different job on three separate
      # nightlies and is why R was pinned on a false hypothesis first.
      #
      # archive.ubuntu.com is slower from Azure-hosted runners, but this only
      # fetches package indices, so it costs seconds against a 10-minute hang.
      # `|| true`: never fail a job because the mirrorlist looks different.
      - name: Use a reachable apt mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -c archive.ubuntu.com /etc/apt/apt-mirrors.txt || true
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with: { use-public-rspm: true }
      - name: Install jsonlite
        run: install.packages("jsonlite")
        shell: Rscript {0}
      - uses: actions/download-artifact@v4
        with: { pattern: fingerprint-*, path: fingerprints }
      - name: Show what was collected
        run: |
          find fingerprints -name '*.json' | sort
          n=$(find fingerprints -name '*.json' | wc -l)
          echo "fingerprints collected: $n"
          # Comparing one platform against itself would pass vacuously.
          if [ "$n" -lt 3 ]; then
            echo "::error::expected 3 platform fingerprints, got $n"; exit 1
          fi
      # Bit-identity across platforms is the WRONG demand -- GEOS and the C
      # library legitimately differ in the last places. 1e-9 relative is far
      # tighter than anything that could move a conclusion, and far looser than
      # the noise floor.
      - name: Linux, macOS and Windows must agree to 1e-9
        run: Rscript tools/ci/compare_fingerprints.R --tolerance 1e-9 $(find fingerprints -name '*.json' | sort | tr '\n' ' ')

  # --------------------------------------------------------------- tier 4: gate
  summary:
    name: nightly summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [preflight, hygiene, syntax, namespace, checksums, lockfile, docs,
            R-CMD-check, testthat, installed-isolation, minimal-deps, renv-restore,
            scientific-mutants, manuscript, scientific-cross-platform, artifact-provenance, multiverse,
            readme, scientific-invariants]
    steps:
      - name: Report and gate
        run: |
          {
            echo "| component | result |"
            echo "|---|---|"
            echo "| repository preflight | ${{ needs.preflight.result }} |"
            echo "| package source hygiene | ${{ needs.hygiene.result }} |"
            echo "| syntax + encoding | ${{ needs.syntax.result }} |"
            echo "| export-tag drift | ${{ needs.namespace.result }} |"
            echo "| data provenance | ${{ needs.checksums.result }} |"
            echo "| renv.lock integrity | ${{ needs.lockfile.result }} |"
            echo "| documentation freshness | ${{ needs.docs.result }} |"
            echo "| R CMD check matrix | ${{ needs['R-CMD-check'].result }} |"
            echo "| testthat suite | ${{ needs.testthat.result }} |"
            echo "| scientific mutation corpus | ${{ needs['scientific-mutants'].result }} |"
            echo "| manuscript render + QA | ${{ needs.manuscript.result }} |"
            echo "| cross-platform science | ${{ needs['scientific-cross-platform'].result }} |"
            echo "| installed-package isolation | ${{ needs['installed-isolation'].result }} |"
            echo "| Imports-only load | ${{ needs['minimal-deps'].result }} |"
            echo "| pinned environment reproduces | ${{ needs['renv-restore'].result }} |"
            echo "| artifact input provenance | ${{ needs['artifact-provenance'].result }} |"
            echo "| specification curve | ${{ needs.multiverse.result }} |"
            echo "| README consistency | ${{ needs.readme.result }} |"
            echo "| frozen-artifact invariants | ${{ needs['scientific-invariants'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.preflight.result }}" "${{ needs.hygiene.result }}" \
                   "${{ needs.syntax.result }}" "${{ needs.namespace.result }}" \
                   "${{ needs.checksums.result }}" "${{ needs.lockfile.result }}" \
                   "${{ needs.docs.result }}" "${{ needs['R-CMD-check'].result }}" \
                   "${{ needs.testthat.result }}" \
                   "${{ needs['installed-isolation'].result }}" \
                   "${{ needs['minimal-deps'].result }}" \
                   "${{ needs['renv-restore'].result }}" \
                   "${{ needs['scientific-mutants'].result }}" \
                   "${{ needs['artifact-provenance'].result }}" \
                   "${{ needs.multiverse.result }}" \
                   "${{ needs.readme.result }}" \
                   "${{ needs['scientific-invariants'].result }}" \
                   "${{ needs.manuscript.result }}" \
                   "${{ needs['scientific-cross-platform'].result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a required nightly component did not succeed"
              exit 1
            fi
          done
          echo "all required components passed"
