# =============================================================================
# Age-matched demand denominators, per subspecialty  (manifest v2, PRESPECIFIED)
# =============================================================================
# Written and frozen BEFORE any outcome is computed, for the same reason the
# specification-curve grid was: once a result is visible, a boundary chosen
# "because it seemed more clinically sensible" is indistinguishable from one
# chosen because it produced a tidier answer.
#
# WHY THIS MATTERS MORE THAN THE OTHER SPECIFICATIONS
#
# The seven executed specifications all vary HOW access is computed. This one
# varies WHO access is for, and the primary analysis indexes every subspecialty
# to the same total-female denominator (ACS B01001_026, all ages). That means:
#
#   * pediatric and adolescent gynecology is currently measured against a
#     population including 80-year-old women;
#   * gynecologic oncology and urogynecology against a population including
#     6-year-old girls.
#
# So the headline that complex family planning and PAG have the worst access is
# partly an artefact of counting people who are not candidates for that care.
# The manuscript concedes the point -- "because every subspecialty was indexed
# to the same total-female denominator" -- but the concession does a lot of
# work, and this is the analysis that tests it.
#
# CONSEQUENCE TO ANTICIPATE: unlike the decay and formulation specifications,
# this one can REORDER the subspecialties, which is manuscript claim C5.
#
# STATUS: specification only. No outcome has been computed. Executing it
# requires a Census API key and a wider ACS pull; see blocked_by below.

manifest_version: 4
frozen_on: "2026-08-23"
supersedes_version: 3
# v4 REGENERATES every band list programmatically from the ACS variable list
# instead of transcribing them. v3 was hand-written and had two defects that
# a reader could not have spotted:
#   * five of seven subspecialties had NO race bands at all, so their White
#     and AIAN denominators came back as zero;
#   * CFP was missing B01001H_025 / B01001C_025 (ages 30-34), silently
#     UNDERCOUNTING both race denominators for that subspecialty.
# Both were caught by building the denominators and reading the totals, not
# by re-reading the file. Generated lists remove the class of error.
supersedes: none            # additive; the v1 specification grid is unchanged
acs_table: B01001           # sex by age; the female block runs _026 .. _049
race_iterations: [B01001H, B01001C]   # White NH, AIAN alone -- 14 female bands, not 23
#
# COMMON BAND EDGES across B01001, B01001H and B01001C, verified against the
# 2020 ACS 5-year variable list:
#
#     0  5  10  15  18  20  25  30  35  45  55  65  75  85
#
# The race iterations are decadal above 35, so the edges 40, 50, 60, 70 and 80
# DO NOT EXIST there. Every cut below sits on a common edge, which is what lets
# the rurality contrast and the race contrasts use the same age window instead
# of two different ones that a reader would have to reconcile.
acs_year: 2020
primary_denominator: B01001_026   # total female, all ages -- what the study uses now

# Age ranges supplied by the investigator (T. Muffly), 2026-08-23. Recorded as
# a clinical judgement, not derived from data, and attributed so a reader can
# see whose judgement it was.
#
# EVERY boundary below falls exactly on an ACS band edge -- verified against the
# 2020 ACS 5-year variable list. No interpolation, apportionment or assumption
# of uniform age distribution within a band is required anywhere. That removes
# an entire class of objection about how these denominators were built.
